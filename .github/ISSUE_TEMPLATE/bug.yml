name: Bug
description: Algo que funcionaba o debería funcionar y no lo hace
labels: [bug]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Esperado vs. obtenido
    validations:
      required: true
  - type: input
    id: rama
    attributes:
      label: Rama o versión
      placeholder: develop, v0.1.0, preview del PR #...
