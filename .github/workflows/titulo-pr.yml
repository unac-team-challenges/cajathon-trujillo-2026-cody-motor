name: titulo-pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  titulo-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Validar Conventional Commits
        env:
          # El título va por env, nunca interpolado en el script (evita inyección).
          TITULO: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$BASE" = "main" ]; then
            patron='^(release: v[0-9]+\.[0-9]+\.[0-9]+|fix(\([a-z0-9-]+\))?!?: .+|chore\(sync\): .+)$'
          else
            patron='^(feat|fix|docs|chore|refactor|test|perf|ci|spike|build|revert)(\([a-z0-9-]+\))?!?: [^A-Z].+$'
          fi
          if printf '%s' "$TITULO" | grep -Eq "$patron"; then
            echo "OK: $TITULO"
          else
            echo "::error::Título inválido para base '$BASE': '$TITULO'. Ver AGENTS.md §4 y §5."
            exit 1
          fi
